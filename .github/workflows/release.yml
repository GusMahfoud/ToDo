name: Release

# Tag `v0.1.0` (matching packages/app/src-tauri/tauri.conf.json → version) to build
# installers on native runners and attach them to a draft GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            args: ""
          - name: macOS Apple Silicon
            os: macos-latest
            triple: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            os: macos-latest
            triple: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - name: Linux x64
            os: ubuntu-22.04 # older glibc → wider compatibility for AppImage/deb/rpm
            triple: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev build-essential curl wget file libxdo-dev

      - run: bun install --frozen-lockfile

      - name: Build todo-mcp sidecar (${{ matrix.triple }})
        run: bun run scripts/build-sidecar.ts ${{ matrix.triple }}

      # Only export Apple signing vars when the secrets exist. An empty
      # APPLE_CERTIFICATE makes the bundler attempt `security import` and fail.
      - name: macOS signing (optional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_S: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_S: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "No APPLE_CERTIFICATE secret — building unsigned macOS bundles."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<EOF"; echo "$CERT"; echo "EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_ID=$APPLE_ID_S"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_S"
            echo "APPLE_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "Signing + notarization enabled."

      - name: Build installers and upload to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/app
          tagName: ${{ github.ref_name }}
          releaseName: "TodoMCP ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
